# Render Blueprint — deploy the whole stack with one click.
# Dashboard -> New -> Blueprint -> point at this repo.
databases:
  - name: razmania-db
    databaseName: razmania
    user: razmania
    plan: basic-256mb          # $6/mo. Do NOT use the free plan: it EXPIRES after 30 days.
    postgresMajorVersion: "16"

services:
  # Read API consumed by WordPress.
  - type: web
    name: razmania-cards-api
    runtime: python
    plan: starter              # $7/mo. The free plan sleeps after 15 min and cold-starts ~1 min.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: razmania-db, property: connectionString }
      - key: ALLOWED_ORIGINS
        value: https://razmania.com,https://www.razmania.com
      - key: API_KEY
        generateValue: true
      - key: CACHE_SECONDS
        value: "1800"

  # DAILY refresh: scrape -> load -> rebuild aggregates -> freshness gate.
  # Runs at 09:00 UTC (05:00 ET) so the site is current before US morning traffic.
  # The scrape window is derived from how stale the DB is, plus a per-tier
  # overlap, so yesterday is always re-read and a missed run self-heals.
  - type: cron
    name: razmania-daily-refresh
    runtime: python
    plan: starter              # billed per second; ~15 min/day => well under $1/mo
    schedule: "0 9 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: ./etl/refresh_daily.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: razmania-db, property: connectionString }
      - key: APIFY_TOKEN
        sync: false            # set this by hand in the dashboard
      - key: MIN_PRICE
        value: "2000"          # Floor. Apify bills per ROW RETURNED.
                               #   $2,000+  ~739 sales/day   ~$111/mo  <- current
                               #   $1,000+  ~1,477/day       ~$222/mo
                               #     $500+  ~3,109/day       ~$466/mo
                               # The leaderboard is IDENTICAL at every floor (the
                               # 50th-biggest sale of a week is ~$27,000). Lowering
                               # the floor only buys medians further down-market.
                               # If you change it, change publish_floor in
                               # db/schema.sql to match and re-run that file.
      - key: HOT_FLOOR
        value: "10000"         # Scraped DAILY. Measured: every one of the top 50
                               # weekly sales was $10,000+, and that slice is only
                               # 68 sales/day. Cheap to keep perfectly fresh.
      - key: TAIL_EVERY
        value: "3"             # DAYS between $2,000-9,999 scrapes. 91% of the
                               # volume, none of the leaderboard - it moves
                               # medians, and it sets how far behind the index
                               # runs, because the index cannot settle a day
                               # until this tier has swept it.
                               #
                               # Apify bills per row RETURNED, so cost is set by
                               # redundancy (1 + 1/k), not by volume:
                               #   k=7  1.14x   $58/mo   index lag  9 days
                               #   k=3  1.33x   $68/mo   index lag  4 days
                               #   k=2  1.50x   $77/mo   index lag  3 days
                               #   k=1  2.00x  $102/mo   index lag  2 days
                               # 9 days -> 4 days costs $10/mo. 4 -> 2 costs $34
                               # more, because at k=1 every row is bought twice.
                               #
                               # refresh_daily.sh writes this into schema_meta,
                               # and db/schema.sql derives the index settle lag
                               # from it - so changing this number here moves
                               # the published lag automatically. Do not also
                               # hardcode a lag in SQL.
                               #
                               # Set to 0 to disable the tail (~$10/mo,
                               # leaderboard + blue-chip index only; the broad
                               # $2,000+ index then publishes nothing, by design).
      # The scrape window is NOT configurable here on purpose. refresh_daily.sh
      # derives it from max(sold_date) so a missed run automatically widens the
      # next one. Hard-coding a window is how you get a permanent daily gap.

  # SALES -> SMS. Polls both RazMania Swoogo events and texts ALERT_TO whenever
  # a confirmed registration's order total changes: attendee tickets and the
  # Sponsor a Kid field on 370376, exhibitor booths on 372565. What counts as a
  # sale, and what each field is called, lives in alerts/config.py.
  #
  # Every 5 minutes because Swoogo has no outbound webhook: there is no way to
  # be pushed a registration, so the only question is how stale the alert is
  # allowed to be. One poll is two HTTP calls and a few seconds of runtime, so
  # this bills at roughly a quarter a month. Tighten to "* * * * *" if a
  # five-minute lag ever matters; nothing else has to change.
  #
  # FIRST DEPLOY: run `python3 alerts/watch.py --seed` once from a Render shell.
  # Both events ALREADY have hundreds of paid registrants; seeding records them
  # WITHOUT texting. The job refuses to send on an unseeded database rather than
  # blowing the whole Textbelt balance announcing history.
  - type: cron
    name: razmania-sale-alerts
    runtime: python
    plan: starter              # billed per second; ~5s per run => well under $1/mo
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python3 alerts/watch.py
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: razmania-db, property: connectionString }
      - key: SWOOGO_KEY
        sync: false            # Swoogo > your name > My Profile > API Credentials
      - key: SWOOGO_SECRET
        sync: false            # the key alone is rejected - both halves needed
      - key: ALERT_TO
        sync: false            # comma-separated numbers, any format
      - key: TEXTBELT_KEY
        sync: false            # textbelt.com. ONE CREDIT PER RECIPIENT per text,
                               # so three phones burns three an alert. Check the
                               # balance with textbelt.com/quota/<key> - it
                               # returns success:false, not an error, at zero.
      - key: ALERT_BATCH
        value: "1"             # 1 = several sales found in one poll go out as a
                               # SINGLE summary text. This is the difference
                               # between a busy day costing 3 credits and 90.
                               # Set to "0" for one text per sale.
      - key: ALERT_SINCE
        value: "2026-08-20 14:02:34"
                               # FORWARD ONLY. A registrant created before this
                               # is recorded and counted but never announced.
                               # --seed already covers the normal case; this
                               # covers a rebuilt database, where every historic
                               # sale would otherwise look brand new.
                               # IN UTC: Swoogo stamps created_at in UTC,
                               # not in the event timezone. Measured.
      - key: ALERTS_OFF
        value: "1"             # KILL SWITCH. 1 = send nothing at all. The poller
                               # still sweeps and records, so flipping this back
                               # to "0" resumes from now rather than dumping the
                               # whole muted period at three phones.
      - key: DIGEST_FROM
        value: "8"             # hourly "where are we" text, 8am..
      - key: DIGEST_TO
        value: "23"            # ..through 11pm, event-local time. 16 a day, so
                               # 48 credits/day at three recipients. Set DIGEST_TO
                               # below DIGEST_FROM to switch the digest off.
      - key: DIGEST_TZ
        value: "America/Detroit"
      - key: FIRST_RUN_GUARD
        value: "5"             # max sales an unseeded run may announce before it
                               # aborts and tells you to --seed instead
